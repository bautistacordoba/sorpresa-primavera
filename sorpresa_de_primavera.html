<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para mi señorina 🌷</title>

    <!-- Fuentes de Google: Playfair Display para elegancia, Montserrat para la instrucción -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. VARIABLES Y CONFIGURACIÓN BASE
           ========================================= */
        :root {
            /* Paleta de colores cálida y primaveral */
            --bg-base: #FDFBF7;
            --text-dark: #3E3129;
            --text-muted: #8C7B6E;
            
            /* Colores del Tulipán */
            --petal-light: #FFE066;
            --petal-main: #FFC420;
            --petal-dark: #E59F00;
            --petal-shadow: #CC7A00;
            
            /* Colores del Tallo y Hojas */
            --leaf-light: #93C082;
            --leaf-main: #6CA659;
            --leaf-dark: #4D803D;

            /* Efecto de brillo */
            --glow-color: rgba(255, 204, 51, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            font-family: 'Playfair Display', serif;
            color: var(--text-dark);
            height: 100dvh; /* dvh asegura que se vea bien en móviles ocultando la barra de navegación */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* =========================================
           2. ATMÓSFERA Y FONDO (BOKEH Y BRILLO)
           ========================================= */
        .ambient-background {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        /* Círculos desenfocados para dar profundidad de campo */
        .bokeh {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.5;
            animation: float-bokeh 20s infinite ease-in-out alternate;
        }

        .bokeh:nth-child(1) { width: 30vw; height: 30vw; background: #FFF5D1; top: -10%; left: -10%; }
        .bokeh:nth-child(2) { width: 40vw; height: 40vw; background: #F8E4D9; bottom: -10%; right: -10%; animation-delay: -5s; }
        .bokeh:nth-child(3) { width: 25vw; height: 25vw; background: #E8F5E9; top: 40%; left: 60%; animation-delay: -10s; }

        /* Brillo central que aparece al abrir la flor */
        .glow-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, var(--glow-color) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 3s ease;
            z-index: 1;
            pointer-events: none;
        }
        .glow-overlay.active { opacity: 1; }

        /* =========================================
           3. LAYOUT ESTRUCTURAL (Para evitar superposición)
           ========================================= */
        .app-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        /* Área superior: Instrucción y Flor */
        .flower-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Empuja la flor hacia abajo */
            align-items: center;
            padding-bottom: 2vh;
            position: relative;
        }

        /* Área inferior: Mensaje (Garantiza su propio espacio) */
        .message-area {
            min-height: 28vh; /* Altura mínima reservada para el texto */
            display: flex;
            align-items: flex-start; /* Texto arriba dentro de su caja */
            justify-content: center;
            padding: 0 5vw;
            text-align: center;
        }

        /* =========================================
           4. TEXTOS E INSTRUCCIONES
           ========================================= */
        .instruction {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-muted);
            margin-bottom: 4vh;
            animation: pulse-text 3s infinite ease-in-out;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }
        .instruction.hidden { opacity: 0; }

        .final-message {
            font-size: clamp(1.8rem, 5vw, 3rem); /* Se adapta perfectamente al ancho */
            line-height: 1.3;
            font-weight: 400;
            font-style: italic;
            opacity: 0; /* Oculto al inicio */
            transform: translateY(20px);
            transition: opacity 2.5s ease, transform 2.5s ease;
            text-shadow: 0 2px 10px rgba(253,251,247,0.8); /* Asegura legibilidad */
        }
        .final-message.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* =========================================
           5. EL TULIPÁN (CONTENEDOR Y SVG)
           ========================================= */
        .tulip-wrapper {
            width: clamp(150px, 35vw, 250px);
            height: clamp(250px, 50vh, 400px);
            cursor: pointer;
            position: relative;
            transform-origin: bottom center;
            /* Balanceo natural del viento */
            animation: sway 7s infinite ease-in-out alternate;
        }
        
        .tulip-wrapper.stop-sway {
            animation-play-state: paused;
        }

        /* Estilos de las partes del SVG */
        svg.tulip {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .petal {
            transition: transform 2s cubic-bezier(0.25, 1, 0.5, 1), fill 2s ease;
            transform-origin: 100px 170px; /* Punto de pivote en la base de la flor */
        }

        /* Estados de Apertura (.is-open) */
        .is-open .petal-left-back { transform: rotate(-45deg) scale(1.1) translate(-15px, 10px); }
        .is-open .petal-right-back { transform: rotate(45deg) scale(1.1) translate(15px, 10px); }
        .is-open .petal-left-front { transform: rotate(-25deg) scale(1.05) translate(-5px, 5px); }
        .is-open .petal-right-front { transform: rotate(25deg) scale(1.05) translate(5px, 5px); }
        .is-open .petal-center-front { transform: translateY(15px) scaleY(0.85) scaleX(1.1); fill: url(#grad-petal-dark); }
        .is-open .petal-center-back { transform: scale(1.1) translateY(-10px); }

        /* =========================================
           6. SISTEMA DE PARTÍCULAS
           ========================================= */
        #particles-container {
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,224,102,0.4) 50%, transparent 100%);
            border-radius: 50%;
            opacity: 0;
            animation: float-up-particle var(--duration, 4s) cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* =========================================
           7. KEYFRAMES (ANIMACIONES)
           ========================================= */
        @keyframes float-bokeh {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -30px) scale(1.1); }
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        @keyframes sway {
            0% { transform: rotate(-3deg); }
            100% { transform: rotate(4deg); }
        }

        @keyframes float-up-particle {
            0% {
                transform: translateY(0) translateX(0) scale(0.5);
                opacity: 0;
            }
            20% { opacity: 0.8; }
            100% {
                transform: translateY(-200px) translateX(var(--random-x, 20px)) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Capas de fondo -->
    <div class="ambient-background">
        <div class="bokeh"></div>
        <div class="bokeh"></div>
        <div class="bokeh"></div>
    </div>
    
    <div class="glow-overlay" id="glow"></div>
    <div id="particles-container"></div>

    <!-- Contenido Principal Estructurado -->
    <main class="app-container">
        
        <!-- Área superior: Flor e Instrucción -->
        <section class="flower-area">
            <!-- Instrucción sutil -->
            <p class="instruction" id="instruction">Hay algo para vos...</p>
            
            <!-- Contenedor del Tulipán interactivo -->
            <div class="tulip-wrapper" id="tulip-wrapper">
                <!-- 
                   SVG DETALLADO DEL TULIPÁN 
                   Diseñado con curvas de bezier orgánicas y gradientes 
                -->
                <svg class="tulip" viewBox="0 0 200 350" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Gradientes para volumen y elegancia -->
                        <linearGradient id="grad-stem" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="var(--leaf-dark)" />
                            <stop offset="50%" stop-color="var(--leaf-main)" />
                            <stop offset="100%" stop-color="var(--leaf-dark)" />
                        </linearGradient>
                        
                        <linearGradient id="grad-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="var(--leaf-light)" />
                            <stop offset="100%" stop-color="var(--leaf-dark)" />
                        </linearGradient>

                        <!-- Gradientes radiales para los pétalos (simula luz interior) -->
                        <radialGradient id="grad-petal-main" cx="50%" cy="80%" r="80%" fx="50%" fy="80%">
                            <stop offset="0%" stop-color="var(--petal-dark)" />
                            <stop offset="40%" stop-color="var(--petal-main)" />
                            <stop offset="100%" stop-color="var(--petal-light)" />
                        </radialGradient>
                        
                        <radialGradient id="grad-petal-dark" cx="50%" cy="100%" r="100%">
                            <stop offset="0%" stop-color="var(--petal-shadow)" />
                            <stop offset="100%" stop-color="var(--petal-dark)" />
                        </radialGradient>
                    </defs>

                    <!-- Tallo curvo natural -->
                    <path d="M100 350 Q 115 260 100 170" fill="none" stroke="url(#grad-stem)" stroke-width="8" stroke-linecap="round" />
                    
                    <!-- Hojas orgánicas -->
                    <!-- Hoja izquierda -->
                    <path d="M98 300 C 60 280 30 220 40 160 C 55 190 80 230 100 260 Z" fill="url(#grad-leaf)" opacity="0.9" />
                    <!-- Hoja derecha -->
                    <path d="M102 320 C 140 300 180 230 160 170 C 145 210 120 250 100 280 Z" fill="url(#grad-leaf)" opacity="0.95" />

                    <!-- 
                         PÉTALOS
                         Todos pivotan en 100, 170.
                    -->
                    <g id="petals-group">
                        <!-- Pétalos traseros (los que más se abren) -->
                        <path class="petal petal-left-back" d="M 100 170 C 60 160 65 90 90 60 C 95 100 100 130 100 170 Z" fill="url(#grad-petal-dark)" />
                        <path class="petal petal-right-back" d="M 100 170 C 140 160 135 90 110 60 C 105 100 100 130 100 170 Z" fill="url(#grad-petal-dark)" />
                        
                        <!-- Pétalo central trasero -->
                        <path class="petal petal-center-back" d="M 100 170 C 70 120 80 50 100 40 C 120 50 130 120 100 170 Z" fill="url(#grad-petal-main)" />

                        <!-- Pétalos frontales laterales -->
                        <path class="petal petal-left-front" d="M 100 170 C 55 150 50 80 80 50 C 90 100 95 130 100 170 Z" fill="url(#grad-petal-main)" />
                        <path class="petal petal-right-front" d="M 100 170 C 145 150 150 80 120 50 C 110 100 105 130 100 170 Z" fill="url(#grad-petal-main)" />
                        
                        <!-- Pétalo central frontal (cubre la base, cae ligeramente al abrir) -->
                        <path class="petal petal-center-front" d="M 100 175 C 75 170 70 100 100 70 C 130 100 125 170 100 175 Z" fill="url(#grad-petal-main)" />
                    </g>
                </svg>
            </div>
        </section>

        <!-- Área inferior: Mensaje sorpresa (Nunca toca el SVG) -->
        <section class="message-area">
            <h1 class="final-message" id="message">
                Feliz inicio de primavera, mi señorina
            </h1>
        </section>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tulipWrapper = document.getElementById('tulip-wrapper');
            const petalsGroup = document.getElementById('petals-group');
            const instruction = document.getElementById('instruction');
            const message = document.getElementById('message');
            const glow = document.getElementById('glow');
            const particlesContainer = document.getElementById('particles-container');
            
            let isOpened = false;

            // Función para crear partículas mágicas
            function spawnParticles() {
                // Cantidad de partículas a generar
                const particleCount = 25; 
                
                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('particle');
                    
                    // Tamaño aleatorio sutil
                    const size = Math.random() * 8 + 3; // entre 3px y 11px
                    particle.style.width = `${size}px`;
                    particle.style.height = `${size}px`;
                    
                    // Posicionamiento inicial en el centro de la pantalla (área de la flor)
                    const startX = window.innerWidth / 2;
                    const startY = window.innerHeight / 2 - 50;
                    
                    particle.style.left = `${startX}px`;
                    particle.style.top = `${startY}px`;
                    
                    // Variables para la animación CSS
                    const randomX = (Math.random() - 0.5) * 300; // Movimiento horizontal aleatorio (-150px a 150px)
                    const duration = Math.random() * 3 + 3; // Duración aleatoria entre 3s y 6s
                    
                    particle.style.setProperty('--random-x', `${randomX}px`);
                    particle.style.setProperty('--duration', `${duration}s`);
                    
                    particlesContainer.appendChild(particle);
                    
                    // Limpieza del DOM
                    setTimeout(() => {
                        particle.remove();
                    }, duration * 1000);
                }
            }

            // Escuchar el click o toque en la flor
            tulipWrapper.addEventListener('click', () => {
                // Evitar múltiples clicks
                if (isOpened) return;
                isOpened = true;

                // 1. Detener el balanceo inmediatamente
                tulipWrapper.classList.add('stop-sway');

                // 2. Desvanecer la instrucción
                instruction.classList.add('hidden');

                // 3. Pausa dramática antes de abrir (600ms)
                setTimeout(() => {
                    // Abrir la flor (activa las transiciones CSS en los pétalos)
                    petalsGroup.classList.add('is-open');
                    
                    // Encender brillo de fondo
                    glow.classList.add('active');
                    
                    // Generar partículas mágicas
                    spawnParticles();

                    // 4. Mostrar el mensaje después de que la flor se abrió un poco
                    setTimeout(() => {
                        message.classList.add('visible');
                    }, 1500); // 1.5 segundos después de empezar a abrirse

                }, 600);
            });
        });
    </script>
</body>
</html>
